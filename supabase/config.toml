# Supabase CLI configuration
# https://supabase.com/docs/guides/cli/config

project_id = "biblemem"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

# Local only. Migration 017 needs this secret to exist. Prod has its own.
[db.vault]
cron_secret = "local-only-not-a-secret"

[studio]
enabled = true

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["exp://", "biblemem://"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MB"

# Edge Functions
# verify_jwt = false because we use ES256 asymmetric keys (new JWT signing keys)
# and handle verification ourselves in the function code
[functions.bible]
verify_jwt = false

[functions.process-recording]
verify_jwt = false

[functions.transcription-token]
verify_jwt = false

# send-notifications authenticates a cron-secret bearer (constant-time
# compare against a Vault-stored value), not a user JWT. Different
# threat model from bible/process-recording, same gateway-bypass.
[functions.send-notifications]
verify_jwt = false

[experimental]
stack = true

[local.services]
default = { version = "bundled" }
