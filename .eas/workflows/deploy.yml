# Deploy to production on every push to main.
#
# Fingerprint routing (see docs/features/release-automation.md):
# - JS-only change  -> a production build with this fingerprint already
#   exists -> publish an OTA update to the `production` branch/channel.
# - Native change   -> no matching build -> full iOS build + App Store
#   submit (buildNumber auto-increments remotely).
#
# Based verbatim on the Expo docs deploy-to-production example
# (https://docs.expo.dev/eas/workflows/examples/deploy-to-production.md),
# iOS jobs only — Android isn't shipped today.

name: Deploy to production

on:
  push:
    branches: ['main']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  get_ios_build:
    name: Check for existing ios build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios_build:
    name: Submit iOS Build
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  publish_ios_update:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: ios
