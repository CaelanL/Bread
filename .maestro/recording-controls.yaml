# Start and discard actual simulator recordings. Speech capture needs a real device.
appId: com.caelanliu.biblemem
name: recording-controls
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-a&next=%2Fsession%3Fid%3Dseed-psalm-23-1-3%26difficulty%3Dmedium%26chunkSize%3D1
- extendedWaitUntil:
    visible:
      id: "mic-button"
    timeout: 30000
- tapOn:
    id: "mic-button"
- tapOn: "OK|Allow"
- extendedWaitUntil:
    visible:
      id: "discard-recording"
    timeout: 15000
- tapOn:
    id: "discard-recording"
- extendedWaitUntil:
    visible:
      id: "mic-button"
    timeout: 10000
- doubleTapOn:
    id: "mic-button"
- extendedWaitUntil:
    visible:
      id: "discard-recording"
    timeout: 15000
- assertNotVisible: "Failed to start recording"
- takeScreenshot: recording-controls-1-active
- tapOn:
    id: "discard-recording"
- extendedWaitUntil:
    visible:
      id: "mic-button"
    timeout: 10000
- assertVisible: "Verse 1"
- takeScreenshot: recording-controls-2-discarded
