appId: com.caelanliu.biblemem
name: intro-test-player-appearance
onFlowComplete:
  - openLink: com.biblemem://settings
  - scrollUntilVisible:
      element:
        text: Light
      direction: DOWN
      timeout: 10000
  - tapOn: Light
  - tapOn:
      id: tab-home
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2Fhome
- extendedWaitUntil:
    visible:
      id: tab-settings
    timeout: 30000
- runFlow:
    file: subflows/intro-test-player-appearance.yaml
    env:
      THEME: Light
- runFlow:
    file: subflows/intro-test-player-appearance.yaml
    env:
      THEME: Dark
- openLink: com.biblemem://home?introFixture=unavailable
- scrollUntilVisible:
    element:
      id: intro-watch
    direction: DOWN
- assertNotVisible:
    id: intro-video-modal
- assertVisible: Original Bread test video
- extendedWaitUntil:
    visible:
      id: intro-watch
      enabled: true
    timeout: 20000
- tapOn:
    id: intro-watch
- extendedWaitUntil:
    visible: Video unavailable. Please try again later.
    timeout: 20000
- assertNotVisible:
    id: intro-video-modal
- takeScreenshot: direct-test-route-unavailable-after-manual
- scrollUntilVisible:
    element:
      id: intro-test-player
    direction: DOWN
- tapOn:
    id: intro-test-player
- extendedWaitUntil:
    visible:
      id: intro-video-modal
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: intro-progress
      text: 00:0[1-8]
    timeout: 10000
- takeScreenshot: direct-test-retry-after-unavailable
- tapOn:
    id: intro-close
- openLink: com.biblemem://home
