appId: com.caelanliu.biblemem
name: intro-test-player
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2Fhome
- scrollUntilVisible:
    element:
      id: intro-test-player
    direction: DOWN
- takeScreenshot: direct-test-home-entry
- tapOn:
    id: intro-test-player
- extendedWaitUntil:
    visible:
      id: intro-video-modal
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: intro-progress
      text: 00:0[1-8]
    timeout: 10000
- assertVisible:
    id: intro-caption
- takeScreenshot: direct-test-first-play
- tapOn:
    id: intro-close
- runScript:
    file: scripts/intro-presentations.js
    env:
      READER: reader-b
      EXPECTED: 0
- tapOn:
    id: intro-test-player
- extendedWaitUntil:
    visible:
      id: intro-video-modal
    timeout: 20000
- takeScreenshot: direct-test-manual-replay
- tapOn:
    id: intro-close
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2Fhome%3FintroFixture%3Dsample
- extendedWaitUntil:
    visible:
      id: intro-video-modal
    timeout: 30000
- tapOn:
    id: intro-close
- runScript:
    file: scripts/intro-presentations.js
    env:
      READER: reader-b
      EXPECTED: 1
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2Fhome
- scrollUntilVisible:
    element:
      id: intro-test-player
    direction: DOWN
- tapOn:
    id: intro-test-player
- extendedWaitUntil:
    visible:
      id: intro-video-modal
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: intro-progress
      text: 00:0[1-8]
    timeout: 10000
- takeScreenshot: direct-test-after-account-claim
- tapOn:
    id: intro-close
- runScript:
    file: scripts/intro-presentations.js
    env:
      READER: reader-b
      EXPECTED: 1
