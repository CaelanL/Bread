# reader-b sees the display name prefilled from the email handle, saves "Bea", and after a
# relaunch and fresh sign-in "Bea" comes back from the profile. Needs a fresh seed (npm run db:reset).
appId: com.caelanliu.biblemem
name: display-name
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2F(tabs)%2Fsettings
- extendedWaitUntil:
    visible:
      id: settings-display-name
    timeout: 20000
- assertVisible: ".*Name.*Reader.*"
- takeScreenshot: display-name-1-prefill
- tapOn:
    id: settings-display-name
- tapOn:
    id: display-name-input
- eraseText
- inputText: "Bea"
- takeScreenshot: display-name-2-modal
- tapOn:
    id: display-name-save
- assertVisible: ".*Name.*Bea.*"
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2F(tabs)%2Fsettings
- extendedWaitUntil:
    visible: ".*Name.*Bea.*"
    timeout: 20000
- takeScreenshot: display-name-3-after-relaunch
