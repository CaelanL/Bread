appId: com.caelanliu.biblemem
name: intro-video
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2Fhome%3FintroFixture%3Dsample
- extendedWaitUntil:
    visible:
      id: intro-video-modal
    timeout: 30000
- assertVisible:
    id: intro-close
- extendedWaitUntil:
    visible:
      id: intro-progress
      text: 00:0[1-8]
    timeout: 10000
- assertVisible:
    id: intro-caption
- takeScreenshot: intro-autoplay-captions
- tapOn:
    id: intro-close
- assertNotVisible:
    id: intro-video-modal
- runScript:
    file: scripts/intro-presentations.js
    env:
      READER: reader-b
      EXPECTED: 1
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2Fhome%3FintroFixture%3Dsample
- scrollUntilVisible:
    element:
      id: intro-watch
    direction: DOWN
- assertNotVisible:
    id: intro-video-modal
- takeScreenshot: intro-no-second-presentation
- tapOn:
    id: intro-watch
- extendedWaitUntil:
    visible:
      id: intro-video-modal
    timeout: 20000
- extendedWaitUntil:
    visible: Pause video
    timeout: 10000
- tapOn: Pause video
- assertVisible: Play video
- takeScreenshot: intro-paused-replay
- tapOn: Play video
- extendedWaitUntil:
    visible: Pause video
    timeout: 10000
- tapOn:
    id: intro-video-surface
- assertVisible: Play video
- copyTextFrom:
    id: intro-progress
# A two-second drag on empty space above the headline; a paused clock must not move.
- swipe:
    start: 20%, 20%
    end: 40%, 20%
    duration: 2000
- assertVisible:
    id: intro-progress
    text: ${maestro.copiedText}
- takeScreenshot: intro-tap-paused
- tapOn:
    id: intro-video-surface
- assertVisible: Pause video
- extendedWaitUntil:
    notVisible:
      id: intro-progress
      text: ${maestro.copiedText}
    timeout: 5000
- takeScreenshot: intro-tap-resumed
- assertVisible:
    id: intro-progress
    text: 00:0[0-4]
# The scrub track spans about 30-83% of the iPhone 16 Pro width at 65% height.
- swipe:
    start: 33%, 65%
    end: 66%, 65%
    duration: 1000
- extendedWaitUntil:
    visible:
      id: intro-progress
      text: 00:0[5-7]
    timeout: 3000
- assertVisible: Pause video
- takeScreenshot: intro-scrubbed-forward
- tapOn:
    id: intro-close
- assertNotVisible:
    id: intro-video-modal
- openLink: com.biblemem://dev-sign-in?as=reader-a&next=%2Fhome%3FintroFixture%3Dunavailable
- scrollUntilVisible:
    element:
      id: intro-watch
    direction: DOWN
- assertNotVisible:
    id: intro-video-modal
- runScript:
    file: scripts/intro-presentations.js
    env:
      READER: reader-a
      EXPECTED: 0
- takeScreenshot: intro-unavailable-source
- openLink: com.biblemem://dev-sign-in?as=reader-a&next=%2Fhome
- scrollUntilVisible:
    element:
      id: intro-watch
    direction: DOWN
- assertVisible:
    id: intro-watch
    text: .*Watch on Desiring God.*
- assertNotVisible:
    id: intro-video-modal
- takeScreenshot: intro-unset-media
