# reader-b's quick add (round 7). Focusing the field hides the books and shows Cancel. "rom" and
# Return fill Romans, "8" and Return fill Romans 8:1, the Romans 8:1-4 row adds at once with an
# Added toast, and Undo takes it back. Then Romans 8:1 and Return add a single verse, which reads
# "Already in this collection" when typed again. Cancel shows the books.
# docs/features/adding-verses.md
appId: com.caelanliu.biblemem
name: quick-add
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2F(tabs)%2F(library)%2Fmy-verses
- waitForAnimationToEnd
# A failed earlier run can leave the verses behind.
- runFlow:
    when:
      visible: ".*Romans 8:1-4 • .*"
    commands:
      - swipe:
          from: ".*Romans 8:1-4 • .*"
          direction: LEFT
      - tapOn:
          id: swipe-delete
      - tapOn:
          text: Delete
          below: "Delete verse?"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: ".*Romans 8:1 • .*"
    commands:
      - swipe:
          from: ".*Romans 8:1 • .*"
          direction: LEFT
      - tapOn:
          id: swipe-delete
      - tapOn:
          text: Delete
          below: "Delete verse?"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "No verses yet"
    timeout: 20000
- tapOn: ".*Add Verse"
- assertVisible: "Genesis.*"
- assertNotVisible:
    id: quick-add-cancel
- tapOn:
    id: quick-add-field
- assertVisible:
    id: quick-add-cancel
- assertNotVisible: "Genesis.*"
- inputText: "rom"
- assertVisible:
    id: quick-add-row-Romans
- pressKey: Enter
- inputText: "8"
- assertVisible:
    id: quick-add-row-Romans-8:1
- pressKey: Enter
- assertVisible:
    id: quick-add-row-Romans-8:1-4
- tapOn:
    id: quick-add-row-Romans-8:1-4
- extendedWaitUntil:
    visible: "Added Romans 8:1-4"
    timeout: 20000
- takeScreenshot: quick-add-1-added
- tapOn:
    id: quick-add-undo
- assertNotVisible: "Added Romans 8:1-4"
- inputText: "Romans 8:1-4"
- extendedWaitUntil:
    visible: "Add Romans 8:1-4"
    timeout: 20000
- eraseText: 20
- inputText: "Romans 8:1"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Added Romans 8:1"
    timeout: 20000
- inputText: "Romans 8:1"
- assertVisible: "Romans 8:1, already in this collection"
- takeScreenshot: quick-add-2-already
- tapOn:
    id: quick-add-cancel
- assertVisible: "Genesis.*"
- assertNotVisible:
    id: quick-add-cancel
- tapOn: Back
- extendedWaitUntil:
    visible: ".*Romans 8:1 • .*"
    timeout: 20000
- assertNotVisible: ".*Romans 8:1-4 • .*"
# Right after Back the first swipe can land before the card takes gestures.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      - swipe:
          from: ".*Romans 8:1 • .*"
          direction: LEFT
      - tapOn:
          id: swipe-delete
- assertVisible: "Delete verse?"
- tapOn:
    text: Delete
    below: "Delete verse?"
- extendedWaitUntil:
    visible: "No verses yet"
    timeout: 20000
