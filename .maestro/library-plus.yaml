# Start from npm run db:reset. reader-b's + menu (round 6): New shared collection asks for a name
# first, then the collection's name, and lands on the code with its own Copy. New collection, then
# Share… and the invite opened by link over the share modal ("You're in", Open): the Library tab
# then pops to the Library and + still opens (step 38). Join with code opens the code entry, and
# again after its X (F40).
# docs/features/library.md
appId: com.caelanliu.biblemem
name: library-plus
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2F(tabs)%2F(library)
- extendedWaitUntil:
    visible: ".*My Verses.*"
    timeout: 20000
- tapOn:
    id: library-add
- assertVisible: "New collection"
- assertVisible: "Join with code"
- takeScreenshot: plus-1-menu

# New shared collection: display name, collection name, then the code.
- tapOn: "New shared collection"
- extendedWaitUntil:
    visible: "What should friends call you?"
    timeout: 8000
- tapOn:
    id: display-name-continue
- extendedWaitUntil:
    visible:
      id: collection-name
    timeout: 8000
- inputText: "Psalm 91"
- tapOn:
    id: create-shared
- extendedWaitUntil:
    visible:
      id: invite-code
    timeout: 15000
- assertVisible: "Psalm 91"
- tapOn:
    id: invite-copy-code
- assertVisible: "Code copied"
- takeScreenshot: plus-2-share-modal
- tapOn:
    id: modal-close
- extendedWaitUntil:
    visible: ".*Psalm 91, Shared · 1 member.*"
    timeout: 20000
# Still open (F40, F48): after an X close, New collection then the next modal route (Share…,
# Join with code) reads as empty to Maestro, so this leg starts from a fresh app.
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2F(tabs)%2F(library)
- extendedWaitUntil:
    visible: ".*Psalm 91, Shared · 1 member.*"
    timeout: 20000

# New collection, Share…, then the invite by link while the share modal is up.
- tapOn:
    id: library-add
- tapOn: "New collection"
- tapOn:
    id: collection-name
- assertNotVisible: "Have an invite code?"
- inputText: "Hebrews"
- tapOn: "Create Collection"
- extendedWaitUntil:
    visible: ".*Hebrews, 0 verses.*"
    timeout: 10000
- longPressOn: ".*Hebrews, 0 verses.*"
- tapOn: "Share…"
- extendedWaitUntil:
    visible:
      id: invite-code
    timeout: 15000
- copyTextFrom:
    id: invite-code
- openLink: com.biblemem://join/${maestro.copiedText}
- extendedWaitUntil:
    visible: "YOU'RE IN"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: plus-3-join-over-share
- tapOn:
    id: join-button
- extendedWaitUntil:
    visible: "Shared · 1 member.*"
    timeout: 15000
# One tab navigator: the tab pops to the Library, and + opens its menu and the name modal.
- tapOn:
    id: tab-library
- extendedWaitUntil:
    visible: ".*Hebrews, Shared · 1 member.*"
    timeout: 10000
- tapOn:
    id: library-add
- tapOn: "New collection"
- extendedWaitUntil:
    visible:
      id: collection-name
    timeout: 5000
- tapOn: "Cancel"

# Join with code, X, then Join with code again: the reopened modal must still be reachable
# (F40: it read as an empty window). docs/architecture/navigation-and-routing.md#modal-routes
- tapOn:
    id: library-add
- tapOn: "Join with code"
- extendedWaitUntil:
    visible:
      id: join-code-input
    timeout: 8000
- takeScreenshot: plus-4-join-code
- tapOn:
    id: modal-close
- extendedWaitUntil:
    notVisible:
      id: join-code-input
    timeout: 5000
- tapOn:
    id: library-add
- tapOn: "Join with code"
- extendedWaitUntil:
    visible:
      id: join-code-input
    timeout: 8000
- takeScreenshot: plus-5-join-code-reopened
- tapOn:
    id: modal-close
- extendedWaitUntil:
    notVisible:
      id: join-code-input
    timeout: 5000
- tapOn:
    id: library-add
- tapOn: "New collection"
- extendedWaitUntil:
    visible:
      id: collection-name
    timeout: 5000
