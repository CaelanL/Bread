# iOS 27 asks "Save Password?" once the sign-in form goes away, and its sheet covers the app.
appId: com.caelanliu.biblemem
---
- extendedWaitUntil:
    visible: "Save Password?"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
