# A fresh app opens com.biblemem://join/${CODE} signed out, signs in as reader-b and waits for
# Cara's invite. Not subflows/sign-in.yaml: it waits for the tab bar, which the modal covers.
appId: com.caelanliu.biblemem
---
- runFlow: open-app.yaml
- openLink: com.biblemem://join/${CODE}
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000
- tapOn: "Email"
- inputText: reader-b@example.test
- tapOn: "Password"
- inputText: password123 # local seed users only, see supabase/seed.sql
# Here the simulator sometimes shows no software keyboard (the fields still fill), and Maestro's
# hideKeyboard then fails; Sign In is reachable either way.
- hideKeyboard:
    optional: true
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: ".* INVITED YOU"
    timeout: 30000
# The reminders card waits until the invite modal closes.
- assertNotVisible: "Maybe later"
