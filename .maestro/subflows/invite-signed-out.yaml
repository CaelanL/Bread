# A fresh app opens com.biblemem://join/${CODE} signed out, signs in as reader-b and waits for
# Cara's invite. Not subflows/sign-in.yaml: it waits for the tab bar, which the modal covers.
appId: com.caelanliu.biblemem
---
- runFlow: open-app.yaml
- openLink: com.biblemem://join/${CODE}
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000
- tapOn: "Email"
- inputText: reader-b@example.test
- tapOn: "Password"
- inputText: password123 # local seed users only, see supabase/seed.sql
# Not hideKeyboard: on iOS 27 a failed one empties the password field. A tap on blank space
# above the form closes the keyboard (the form's first tap only does that).
- tapOn:
    point: "50%,15%"
- tapOn: "Sign In"
- extendedWaitUntil:
    notVisible: "Sign In"
    timeout: 30000
# Its sheet hides the invite modal from Maestro until it's answered.
- runFlow: skip-save-password.yaml
- extendedWaitUntil:
    visible: ".* INVITED YOU"
    timeout: 30000
# The reminders card waits until the invite modal closes.
- assertNotVisible: "Maybe later"
