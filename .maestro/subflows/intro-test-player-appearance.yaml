appId: com.caelanliu.biblemem
---
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      text: ${THEME}
    direction: DOWN
    timeout: 10000
- tapOn: ${THEME}
- tapOn:
    id: tab-home
- scrollUntilVisible:
    element:
      id: intro-test-player
    direction: DOWN
- takeScreenshot: direct-test-${THEME}-home-entry
- tapOn:
    id: intro-test-player
- extendedWaitUntil:
    visible:
      id: intro-video-modal
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: intro-progress
      text: 00:0[1-8]
    timeout: 10000
- assertVisible:
    id: intro-caption
- takeScreenshot: direct-test-${THEME}-player
- tapOn:
    id: intro-close
- assertNotVisible:
    id: intro-video-modal
