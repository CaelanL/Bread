appId: com.caelanliu.biblemem
---
- tapOn:
    id: tab-home
- scrollUntilVisible:
    element:
      id: discover-anxiety-and-peace
    direction: DOWN
    visibilityPercentage: 100
- extendedWaitUntil:
    visible: "Anxiety & Peace, 12 passages, ${SAVER_LABEL}"
    timeout: 20000
- takeScreenshot: savers-${STEP}-home
- tapOn:
    id: explore-see-all
- extendedWaitUntil:
    visible: "Anxiety & Peace, 12 passages, ${SAVER_LABEL}"
    timeout: 20000
- takeScreenshot: savers-${STEP}-explore
- tapOn:
    id: discover-anxiety-and-peace
- extendedWaitUntil:
    visible:
      id: collection-savers-anxiety-and-peace
      text: ${SAVER_LABEL}
    timeout: 20000
- takeScreenshot: savers-${STEP}-detail
