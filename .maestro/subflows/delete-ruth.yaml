# In My Verses: swipes Ruth 1:1 away and confirms, back to the empty list.
appId: com.caelanliu.biblemem
---
- swipe:
    from: ".*Ruth 1:1 • ESV.*"
    direction: LEFT
- tapOn:
    id: swipe-delete
- assertVisible: "Delete verse?"
- tapOn:
    text: Delete
    below: "Delete verse?"
- extendedWaitUntil:
    visible: "No verses yet"
    timeout: 20000
