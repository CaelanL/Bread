# In My Verses: swipes Ruth 1:1 away and confirms, back to the empty list.
appId: com.caelanliu.biblemem
---
- swipe:
    from: ".*Ruth 1:1 • ESV.*"
    direction: LEFT
- tapOn: "trash, Delete"
- tapOn: "Delete" # the "Delete verse?" alert
- extendedWaitUntil:
    visible: "No verses yet"
    timeout: 20000
