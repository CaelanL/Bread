# Signs in as EMAIL from the Sign In screen and waits for the tabs.
appId: com.caelanliu.biblemem
env:
  PASSWORD: password123 # local seed users only, see supabase/seed.sql
---
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
# Not hideKeyboard: on iOS 27 a failed one empties the password field. A tap on blank space
# above the form closes the keyboard (the form's first tap only does that).
- tapOn:
    point: "50%,15%"
- tapOn: "Sign In"
- extendedWaitUntil:
    notVisible: "Sign In"
    timeout: 60000
- runFlow: skip-save-password.yaml
- waitForAnimationToEnd
# The reminders card covers the tabs on a first sign-in.
- tapOn:
    text: "Maybe later"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-settings"
    timeout: 30000
