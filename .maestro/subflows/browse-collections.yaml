appId: com.caelanliu.biblemem
---
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      text: ${THEME}
    direction: DOWN
- tapOn: ${THEME}
- tapOn:
    id: tab-home
- scrollUntilVisible:
    element:
      id: explore-see-all
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: discovery-${THEME}-home
- tapOn:
    id: explore-see-all
- assertVisible:
    id: discover-anxiety-and-peace
- takeScreenshot: discovery-${THEME}-explore
- scrollUntilVisible:
    element:
      id: discover-gratitude-and-joy
    direction: DOWN
- scrollUntilVisible:
    element:
      id: discover-anxiety-and-peace
    direction: UP
- tapOn:
    id: discover-anxiety-and-peace
- assertVisible: "Anxiety & Peace"
- tapOn:
    id: curated-version-KJV
- takeScreenshot: discovery-${THEME}-introduction
# The scroll viewport ends above the sticky footer. Maestro can report a row
# below that edge as visible, so bring it clear of the footer before tapping.
- swipe:
    start: 50%, 68%
    end: 50%, 43%
    duration: 450
- scrollUntilVisible:
    element:
      id: curated-passage-0
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: curated-passage-0
- extendedWaitUntil:
    visible:
      id: curated-preview-text
      text: ".*Casting all your care upon him.*"
    timeout: 10000
- takeScreenshot: discovery-${THEME}-passage
