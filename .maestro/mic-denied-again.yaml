# reader-a denies the microphone, then taps the mic again. With no prompt the second time,
# "Permission required" shows once for that tap, not twice.
appId: com.caelanliu.biblemem
name: mic-denied-again
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-a&next=%2F(tabs)%2F(library)%2Fsetup%2Fseed-psalm-23-1-3
- extendedWaitUntil:
    visible: "Start session.*"
    timeout: 20000
- tapOn: "Medium.*"
- tapOn: "Start session.*"
- extendedWaitUntil:
    visible:
      id: "mic-button"
    timeout: 30000
- tapOn:
    id: "mic-button"
- extendedWaitUntil:
    visible: "Don’t Allow|Don't Allow"
    timeout: 30000
- tapOn: "Don’t Allow|Don't Allow"
- assertVisible: "Permission required"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "mic-button"
    timeout: 10000
- tapOn:
    id: "mic-button"
- extendedWaitUntil:
    visible: "Permission required"
    timeout: 10000
- assertNotVisible: "Don’t Allow|Don't Allow"
- takeScreenshot: mic-denied-again-1-alert
- tapOn: "OK"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "Permission required"
- assertVisible:
    id: "mic-button"
- takeScreenshot: mic-denied-again-2-dismissed
