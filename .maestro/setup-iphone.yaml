# reader-a on Psalm 23:1-3's study setup: the whole passage opens from the reference bubble, from ⤢
# and from the verse text, and closes each time; Medium; chunk size 2 from the sheet, then All,
# then 2 again; Start opens the session in chunks of 2.
appId: com.caelanliu.biblemem
name: setup-iphone
tags: [fresh-seed]
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-a&next=%2F(tabs)%2F(library)%2Fsetup%2Fseed-psalm-23-1-3
- extendedWaitUntil:
    visible: "Start session.*"
    timeout: 20000
- takeScreenshot: setup-iphone-1-setup
- tapOn:
    id: reference-bubble
- extendedWaitUntil:
    visible:
      id: passage-close
    timeout: 5000
- assertVisible: ".*still waters.*"
- takeScreenshot: setup-iphone-2-passage
- tapOn:
    id: passage-close
- extendedWaitUntil:
    notVisible:
      id: passage-close
    timeout: 5000
- tapOn:
    id: verse-expand
- extendedWaitUntil:
    visible:
      id: passage-close
    timeout: 5000
- tapOn:
    id: passage-close
- extendedWaitUntil:
    notVisible:
      id: passage-close
    timeout: 5000
- tapOn:
    id: verse-preview
- extendedWaitUntil:
    visible:
      id: passage-close
    timeout: 5000
# The backdrop closes it too.
- tapOn:
    point: 50%,95%
- extendedWaitUntil:
    notVisible:
      id: passage-close
    timeout: 5000
- tapOn: "Medium.*"
- tapOn:
    id: chunk-size
- tapOn:
    id: chunk-option-2
- assertVisible:
    id: chunk-size
    text: ".*2.*"
- tapOn:
    id: chunk-all
- tapOn:
    id: chunk-size
- takeScreenshot: setup-iphone-3-chunk-sheet
- tapOn:
    id: chunk-option-2
- takeScreenshot: setup-iphone-4-chunk-2
- tapOn: "Start session.*"
- extendedWaitUntil:
    visible: "Verses 1-2"
    timeout: 30000
- takeScreenshot: setup-iphone-5-session
