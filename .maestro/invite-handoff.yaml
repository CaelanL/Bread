# Automatic join after a fresh install: the sendlabs.dev join page recorded Cara's invite for this
# network, then a fresh install signs in as reader-b and the invite opens by itself. Closes it
# without joining, so it changes no group.
appId: com.caelanliu.biblemem
name: invite-handoff
---
- runScript:
    file: scripts/shared-collections.js
    env:
      READER: reader-c
      MODE: invite
- runScript:
    file: scripts/shared-collections.js
    env:
      READER: reader-c
      MODE: handoff
      CODE: ${output.code}
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2F(tabs)%2F(library)
- extendedWaitUntil:
    visible: "CARA INVITED YOU"
    timeout: 20000
- takeScreenshot: handoff-1-invite-opened
- tapOn:
    id: modal-close
- extendedWaitUntil:
    visible: ".*My Verses.*"
    timeout: 10000
