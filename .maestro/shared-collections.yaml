# Start from npm run db:reset. reader-a shares Psalms, reader-b joins by link, both are in Who's
# where and the member list; reader-b leaves (the unmastered verse goes), rejoins, is removed while
# their Library is stale, rejoins; reader-a deletes for everyone and reader-b keeps a personal copy. docs/features/shared-collections.md
appId: com.caelanliu.biblemem
name: shared-collections
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-a&next=%2F(tabs)%2F(library)
- extendedWaitUntil:
    visible: ".*Psalms, 1 verse.*"
    timeout: 20000
- longPressOn: ".*Psalms, 1 verse.*"
- tapOn: "Share…"
- extendedWaitUntil:
    visible: "What should friends call you?"
    timeout: 8000
- takeScreenshot: shared-1-name-sheet
- tapOn:
    id: display-name-continue
- extendedWaitUntil:
    visible:
      id: invite-code
    timeout: 15000
- assertVisible: ".*com.biblemem://join/.*"
- assertVisible: "Expires in 14 days"
- takeScreenshot: shared-2-owner-sheet
- tapOn:
    id: invite-copy
- assertVisible: ".*Copied"
- runScript:
    file: scripts/shared-collections.js
    env:
      READER: reader-a
      MODE: invite

# reader-b opens the link.
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2Fjoin%2F${output.code}
- extendedWaitUntil:
    visible: "READER INVITED YOU"
    timeout: 20000
- assertVisible: "Psalms"
- assertVisible: "1 verse · 1 member"
- assertVisible: ".*progress you already have on it.*"
- takeScreenshot: shared-3-join-modal
- tapOn:
    id: join-button
- extendedWaitUntil:
    visible: "What should friends call you?"
    timeout: 8000
- tapOn:
    id: display-name-sheet-input
- eraseText
- inputText: "Bea"
- tapOn:
    id: display-name-continue
- extendedWaitUntil:
    visible: ".*Psalms 23:1-3.*"
    timeout: 20000
- assertNotVisible:
    id: swipe-delete
- assertVisible: "Shared · 2 members.*"
- takeScreenshot: shared-4-joined-collection
# Both names in Who's where.
- tapOn:
    id: shared-progress
- extendedWaitUntil:
    visible: "Reader, Owner"
    timeout: 10000
- assertVisible: "Bea, you, Member"
- assertVisible: "You, Psalms 23:1-3, Open"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Shared · 2 members.*"
    timeout: 10000
- tapOn:
    id: shared-row
- extendedWaitUntil:
    visible: "Reader, Owner"
    timeout: 10000
- assertVisible: "Bea, you, Member"
- takeScreenshot: shared-5-member-sheet
- tapOn:
    id: shared-leave
- assertVisible: 'Leave "Psalms"?'
- assertVisible: ".*1 verse not mastered or in another collection will be deleted.*"
- tapOn: Cancel
- tapOn:
    id: modal-close

# Library shows it as shared; leaving from the swipe takes the unmastered verse.
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2F(tabs)%2F(library)
- extendedWaitUntil:
    visible: ".*Psalms, Shared · 2 members.*"
    timeout: 15000
- swipe:
    from: ".*Psalms, Shared · 2 members.*"
    direction: LEFT
- takeScreenshot: shared-6-swipe-leave
- tapOn:
    id: swipe-delete
- assertVisible: 'Leave "Psalms"?'
- tapOn:
    text: Leave
    index: 1
- extendedWaitUntil:
    notVisible: ".*Psalms, .*"
    timeout: 10000
- runScript:
    file: scripts/shared-collections.js
    env:
      READER: reader-b
      MODE: no-copy

# Rejoin, then the owner deletes for everyone.
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2Fjoin%2F${output.code}
- extendedWaitUntil:
    visible:
      id: join-button
    timeout: 20000
- tapOn:
    id: join-button
- extendedWaitUntil:
    visible: ".*Psalms 23:1-3.*"
    timeout: 20000

# The owner removes reader-b while their Library still shows the card: opening it says why once
# and goes back to the Library. Then reader-b joins again.
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2F(tabs)%2F(library)
- extendedWaitUntil:
    visible: ".*Psalms, Shared · 2 members.*"
    timeout: 15000
- runScript:
    file: scripts/shared-collections.js
    env:
      READER: reader-a
      MODE: remove-members
# The toast lasts 3 s, so the tap doesn't wait for the screen to settle.
- tapOn:
    text: ".*Psalms, Shared · 2 members.*"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: ".*You were removed from Psalms.*"
    timeout: 10000
- assertNotVisible: ".*Couldn't update this shared collection.*"
- extendedWaitUntil:
    notVisible: ".*Psalms, .*"
    timeout: 10000
- assertVisible: "Library"
- takeScreenshot: shared-6b-removed-stale-card
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2Fjoin%2F${output.code}
- extendedWaitUntil:
    visible:
      id: join-button
    timeout: 20000
- tapOn:
    id: join-button
- extendedWaitUntil:
    visible: ".*Psalms 23:1-3.*"
    timeout: 20000
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-a&next=%2F(tabs)%2F(library)
- extendedWaitUntil:
    visible: ".*Psalms, Shared · 2 members.*"
    timeout: 20000
- longPressOn: ".*Psalms, Shared · 2 members.*"
- tapOn: Delete
- assertVisible: "Delete for everyone?"
- assertVisible: ".*Members keep their own copy.*"
- takeScreenshot: shared-7-delete-for-everyone
- tapOn: Delete
- extendedWaitUntil:
    notVisible: ".*Psalms, .*"
    timeout: 10000
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-b&next=%2F(tabs)%2F(library)
- extendedWaitUntil:
    visible: ".*Psalms, 1 verse.*"
    timeout: 20000
- assertNotVisible: ".*Psalms, .*Shared.*"
- takeScreenshot: shared-8-personal-copy
- runScript:
    file: scripts/shared-collections.js
    env:
      READER: reader-b
      MODE: personal-copy
