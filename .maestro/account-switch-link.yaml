# A dev-sign-in link to another account with no sign-out first (the same shape as a deep link
# with another account's tokens): reader-a's Library, then reader-c's. reader-a's "Psalms" must
# never show under reader-c (docs/architecture/auth.md).
appId: com.caelanliu.biblemem
name: account-switch-link
---
- runFlow: subflows/open-app.yaml
- openLink: com.biblemem://dev-sign-in?as=reader-a&next=%2F(tabs)%2F(library)
- extendedWaitUntil:
    visible: ".*Psalms.*"
    timeout: 60000
- takeScreenshot: account-switch-link-1-reader-a
- openLink: com.biblemem://dev-sign-in?as=reader-c&next=%2F(tabs)%2F(library)
- assertNotVisible: ".*Psalms.*"
# The first frame with reader-c's own content ("Romans 8" is reader-c's only).
- extendedWaitUntil:
    visible: ".*Romans 8.*"
    timeout: 30000
- takeScreenshot: account-switch-link-2-just-switched
- assertNotVisible: ".*Psalms.*"
